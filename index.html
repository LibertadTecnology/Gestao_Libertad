/* ---------- TAREFAS ---------- */
function filtrarTarefas() {
  var sel = P.tPessoas || [], pj = P.tProjeto || '', q = norm(P.tBusca || '').trim();
  return DB.tarefas.filter(function (t) {
    if (sel.length && sel.indexOf(t.responsavel) < 0) return false;
    if (pj === '__sem' && t.projeto) return false;
    if (pj && pj !== '__sem' && t.projeto !== pj) return false;
    if (q && !casa(t.titulo + ' ' + (t.descricao || '') + ' ' + nomeProjeto(t.projeto) + ' ' + nomeCurto(t.responsavel), q)) return false;
    return true;
  });
}
function filtroPessoasHtml() {
  var sel = P.tPessoas || [];
  return '<div class="filtro-pessoas' + (sel.length ? '' : ' nenhum') + '" role="group" aria-label="Filtrar por sócio">' + DB.socios.map(function (s) {
    var on = sel.indexOf(s.id) >= 0;
    return '<button type="button" data-a="filtro-pessoa" data-id="' + s.id + '" class="' + (on ? 'on' : '') + '" title="' + esc(s.nome) + '" aria-pressed="' + (sel.indexOf(s.id) >= 0) + '">' + av(s.id, 'm') + '</button>';
  }).join('') + (sel.length ? '<button type="button" class="btn peq fant todos" data-a="filtro-pessoa" data-id="">Todos</button>' : '') + '</div>';
}
function respPadrao() { var s = P.tPessoas || []; return s.length === 1 ? s[0] : EU; }
function formKadd(status) {
  return '<form class="kadd-form" data-form="add-tarefa" data-status="' + status + '"><input class="ent" id="kadd-input" placeholder="O que precisa ser feito?" autocomplete="off" maxlength="200" aria-label="Título da nova tarefa">' +
    '<div class="linha"><button type="submit" class="btn pri peq">Adicionar</button><button type="button" class="btn fant peq" data-a="kadd-fechar">Fechar</button><span class="cresce"></span><span class="mudo mini">para</span>' + av(respPadrao(), 'p') + '</div></form>';
}
function colunaTarefas(lista, status) {
  var col = lista.filter(function (t) { return t.status === status; });
  if (status === 'feito') return col.sort(function (a, b) { return (b.concluido_em || '') < (a.concluido_em || '') ? -1 : 1; });
  return col.sort(function (a, b) { return a.ordem - b.ordem; });
}
function quadroTarefas(lista) {
  var limite = Date.now() - 14 * 864e5;
  return '<div class="quadro" data-rolar="quadro-tarefas">' + STATUS.map(function (s) {
    var col = colunaTarefas(lista, s.id), ocultas = 0;
    if (s.id === 'feito' && !P.tVerAntigas) {
      var rec = col.filter(function (t) { return !t.concluido_em || new Date(t.concluido_em).getTime() >= limite; });
      ocultas = col.length - rec.length; col = rec;
    }
    return '<section class="kcol" data-col="' + s.id + '" style="--c:' + s.cor + '" aria-label="' + s.nome + '">' +
      '<div class="kcol-cab"><span class="bol"></span>' + s.nome + ' <span class="qt">' + col.length + '</span><button type="button" class="btn ic peq fant" data-a="kadd" data-status="' + s.id + '" aria-label="Adicionar tarefa em ' + s.nome + '">' + I('mais', 'p') + '</button></div>' +
      '<div class="klista">' + col.map(kcardTarefa).join('') + '</div>' +
      (UI.kadd === s.id ? formKadd(s.id) : '<button type="button" class="kmais" data-a="kadd" data-status="' + s.id + '">' + I('mais', 'p') + 'Adicionar tarefa</button>') +
      (ocultas ? '<button type="button" class="kmais" data-a="ver-antigas">Mostrar ' + plural(ocultas, 'concluída antiga', 'concluídas antigas') + '</button>' : '') +
      '</section>';
  }).join('') + '</div>';
}
function listaTarefas(lista) {
  var html = '';
  STATUS.forEach(function (s) {
    var g = s.id === 'feito' ? colunaTarefas(lista, 'feito') : lista.filter(function (t) { return t.status === s.id; }).sort(ordenarPorPrazo);
    var total = g.length;
    if (s.id === 'feito' && !P.tVerAntigas) g = g.slice(0, 10);
    html += '<div class="card" style="margin-bottom:14px"><div class="card-cab"><h3><span class="cor-dot" style="--c:' + s.cor + '"></span>' + s.nome + ' <span class="mudo peq">' + total + '</span></h3>' +
      '<button type="button" class="btn ic peq fant" data-a="nova-tarefa" data-status="' + s.id + '" aria-label="Nova tarefa em ' + s.nome + '">' + I('mais', 'p') + '</button></div>' +
      (g.length ? '<div class="lista-itens">' + g.map(function (t) { return itemTarefa(t); }).join('') + '</div>' : '<p class="mudo peq">Nenhuma tarefa aqui.</p>') +
      (total > g.length ? '<button type="button" class="kmais" style="width:100%;margin-top:10px" data-a="ver-antigas">Mostrar todas as ' + total + '</button>' : '') + '</div>';
  });
  return html;
}

/* ---------- AGENDA ---------- */
function ocorrencias(ini, fim) {
  var L = [];
  DB.eventos.forEach(function (e) {
    if (!validaISO(e.data)) return;
    var te = cfg(TIPOS_EVENTO, e.tipo);
    function add(d) { L.push({ tipo: 'evento', data: d, hora: e.hora || '', titulo: e.titulo, sub: (e.hora ? e.hora + ' · ' : '') + (e.local || te.nome) + (e.recorrente ? ' · repete' : ''), cor: te.cor, ref: e }); }
    if (e.recorrente === 'semanal') {
      var d = e.data;
      if (d < ini) d = somaDias(d, Math.ceil(difEntre(d, ini) / 7) * 7);
      while (d <= fim) { add(d); d = somaDias(d, 7); }
    } else if (e.recorrente === 'mensal') {
      for (var n = 0; n < 600; n++) { var d2 = somaMeses(e.data, n); if (d2 > fim) break; if (d2 >= ini) add(d2); }
    } else if (e.data >= ini && e.data <= fim) add(e.data);
  });
  DB.tarefas.forEach(function (t) {
    if (t.status !== 'feito' && validaISO(t.prazo) && t.prazo >= ini && t.prazo <= fim) L.push({ tipo: 'tarefa', data: t.prazo, hora: '', titulo: t.titulo, sub: 'Prazo de tarefa · ' + nomeCurto(t.responsavel), cor: '#9C8FC0', ref: t });
  });
  DB.projetos.forEach(function (p) {
    if (validaISO(p.entrega) && idxEtapa(p.etapa) < 4 && p.entrega >= ini && p.entrega <= fim) L.push({ tipo: 'projeto', data: p.entrega, hora: '', titulo: 'Entrega: ' + p.nome, sub: cfg(ETAPAS, p.etapa).nome, cor: '#2BD9A8', ref: p });
  });
  DB.lancamentos.forEach(function (l) {
    if (!l.pago && validaISO(l.data) && l.data >= ini && l.data <= fim) L.push({ tipo: 'lancamento', data: l.data, hora: '', titulo: (l.tipo === 'entrada' ? 'Receber: ' : 'Pagar: ') + l.descricao, sub: moeda(l.valor), cor: l.tipo === 'entrada' ? '#FF9A3D' : '#FF5A5F', ref: l });
  });
  return L.sort(function (a, b) { return a.data !== b.data ? (a.data < b.data ? -1 : 1) : ((a.hora || '99') < (b.hora || '99') ? -1 : 1); });
}

  if (antes === status) return;

  if (status === 'assinado') k.data_assinatura = data || hojeISO();

  k.historico = (k.historico || []).concat([{ em: agoraISO(), por: EU, texto: texto || 'Status alterado para ' + st.nome }]);
  gravar('contrato', k);
  registrar('marcou o contrato ' + k.numero + ' como ' + st.nome.toLowerCase(), { tipo: 'contrato', id: k.id });
  toast('Contrato ' + k.numero + ': ' + st.nome.toLowerCase(), {

function automacoesAssinatura(k) {

  if (p && idxEtapa(p.etapa) < 1) { p.etapa = 'inicial'; gravar('projeto', p, { semRender: true }); msgs.push('o projeto foi para “Fase inicial”'); }
  var temCob = DB.lancamentos.some(function (l) { return l.contrato === k.id; });
  setTimeout(function () {
    if (msgs.length) toast('Automático: ' + msgs.join(' e ') + '.', { icone: 'raio', tempo: 5000 });
    if (!temCob && (k.valor || k.mensal)) setTimeout(function () { if (DB.lancamentos.some(function (l) { return l.contrato === k.id; })) return; toast('Gerar as cobranças deste contrato no financeiro?', { icone: 'dinheiro', acao: 'Gerar', tempo: 9000, fn: function () { cobrancasContrato(por(DB.contratos, k.id)); } }); }, msgs.length ? 1200 : 0);

function planoCobrancas(k) {
  var base = k.data_assinatura || k.inicio || hojeISO(), D = Math.min(28, +k.vencimento || 10), L = [], nome = nomeCliente(k.cliente) || 'cliente';
  function venc(n) { var d = somaMeses(base, n); d = d.slice(0, 8) + pad(D); while (d < base) d = somaMeses(d, 1); return d; }
  function add(parte, valor, data, cat) {
    L.push({ id: uid('l'), tipo: 'entrada', descricao: k.numero + ' · ' + nome + ' — ' + parte, valor: Math.round(valor * 100) / 100, data: data, pago: false, pago_em: '', categoria: cat, cliente: k.cliente || '', projeto: k.projeto || '', contrato: k.id, notas: '' });
  }
  var V0 = +k.valor || 0, M = +k.mensal || 0, np = Math.max(1, +k.parcelas || 1);
  if (k.forma !== 'mensal' && V0) {
    if (k.forma === 'avista') add('pagamento à vista', V0, base, 'Projeto');
    else if (k.forma === 'entrada') {
      var en = +k.entrada || 0;
      if (en) add('entrada', en, base, 'Projeto');
      for (var i = 1; i <= np; i++) add('parcela ' + i + '/' + np, (V0 - en) / np, venc(i), 'Projeto');
    } else for (var j = 1; j <= np; j++) add('parcela ' + j + '/' + np, V0 / np, venc(j), 'Projeto');
  }
  if (M) {
    var vig = Math.max(1, +k.vigencia || 12), ini = k.forma === 'mensal' ? 0 : Math.max(1, Math.ceil((+k.prazo_dias || 30) / 30));
    for (var m = 0; m < vig; m++) add('mensalidade ' + (m + 1) + '/' + vig, M, venc(ini + m), 'Mensalidade');
  }
  return L;
}
function cobrancasContrato(k) {
  if (!k) return;
  var existentes = DB.lancamentos.filter(function (l) { return l.contrato === k.id; });
  if (existentes.length) { P.fFiltro = 'todos'; salvarPrefs(); irPara('#/financeiro'); toast('Este contrato já tem ' + plural(existentes.length, 'cobrança', 'cobranças') + ' no financeiro.', { icone: 'info' }); return; }
  var L = planoCobrancas(k);
  if (!L.length) { toast('Preencha o valor do contrato (Editar dados) para gerar as cobranças.', { icone: 'info', tempo: 5000 }); return; }
  confirmar({ titulo: 'Gerar ' + plural(L.length, 'cobrança', 'cobranças') + '?', texto: 'Total de ' + moeda(soma(L, 'valor')) + ' a receber, com o primeiro vencimento em ' + fmtDataBR(L[0].data) + '. Elas aparecem no Financeiro e na Agenda.', ok: 'Gerar cobranças' }).then(function (ok) {

    registrarHistorico(k, plural(L.length, 'cobrança gerada', 'cobranças geradas') + ' no financeiro');
    registrar('gerou ' + plural(L.length, 'cobrança', 'cobranças') + ' do contrato ' + k.numero, { tipo: 'contrato', id: k.id });
    toast(plural(L.length, 'cobrança criada', 'cobranças criadas'), { acao: 'Ver', fn: function () { P.fFiltro = 'receber'; salvarPrefs(); irPara('#/financeiro'); } });
  });
}
function duplicarContrato(k) {

/* ---------- navegação ---------- */
function rotaAtual() {
  var h = location.hash || '';
  if (/access_token=|refresh_token=|error_description=|type=recovery/.test(h)) return { pag: 'inicio', id: '' };
  var p = h.replace(/^#\/?/, '').split('/');
  return { pag: V[p[0]] ? p[0] : 'inicio', id: p[1] ? decodeURIComponent(p[1]) : '' };
}
function irPara(h) { if (location.hash === h) render(true); else location.hash = h; }
var ultimaRota = '';
function render(trocou) {
  if (!EU || !DB) return;
  var r = rotaAtual(), chave = r.pag + '/' + r.id, mudou = trocou === true || chave !== ultimaRota;
  ultimaRota = chave; UI.rota = r;
  if (mudou && r.pag !== 'tarefas') UI.kadd = '';
  var c = $('#conteudo'), ativo = document.activeElement, foco = null, rol = {};
  if (!mudou && ativo && c.contains(ativo) && ativo.id) { foco = { id: ativo.id }; try { foco.a = ativo.selectionStart; foco.b = ativo.selectionEnd; } catch (e) { } }
  $$('[data-rolar]', c).forEach(function (el) { rol[el.dataset.rolar] = el.scrollLeft; });
  var v;
  try { v = V[r.pag](r.id) || { html: '' }; }
  catch (e) { if (window.console) console.error(e); v = { html: '<div class="card">' + vazio('alerta', 'Algo deu errado nesta tela', String((e && e.message) || e)) + '</div>' }; }
  c.classList.toggle('sem-anim', !mudou);
  c.innerHTML = v.html;
  if (v.depois) { try { v.depois(c); } catch (e) { if (window.console) console.error(e); } }
  if (!mudou) Object.keys(rol).forEach(function (k) { var el = $('[data-rolar="' + k + '"]', c); if (el) el.scrollLeft = rol[k]; });
  if (foco) { var el = document.getElementById(foco.id); if (el) { try { el.focus({ preventScroll: true }); if (foco.a != null) el.setSelectionRange(foco.a, foco.b); } catch (e) { } } }
  if (mudou) window.scrollTo(0, 0);
  atualizarCasca();
  document.title = (TITULOS[r.pag] || 'Gestão') + ' · Libertad';
}
var agendarRender = (function () {
  var pend = false;
  return function () {
    if (pend) return;
    pend = true;
    requestAnimationFrame(function () {
      pend = false;
      if (UI.drag && UI.drag.ativo) { agendarRender(); return; }
      render();
    });
  };
})();

  e.hidden = false; $('#app').classList.remove('on');
}
function fecharTudo() { if (UI.gaveta) fecharGaveta(true); fecharPaleta(); fecharNotif(); fecharMenus(); fecharFolha(); }
function mostrarEntrada(erro) {
  fecharTudo();
  var e = $('#entrada'), html = '<div class="entrada-box"><svg aria-hidden="true"><use href="#logo"/></svg><h1>Libertad <span class="grad-txt">Gestão</span></h1>';
  if (Nuvem.cfg && Nuvem.cli) {
    html += '<p class="sub">Entre com o seu e-mail e senha.</p><form class="login-form" data-form="login" novalidate>' +
      '<div class="campo"><label for="lg-email">E-mail</label><input class="ent" id="lg-email" type="email" autocomplete="username" inputmode="email" placeholder="voce@email.com"></div>' +
      '<div class="campo"><label for="lg-senha">Senha</label><input class="ent" id="lg-senha" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
      '<p class="erro-login" id="erro-login" aria-live="polite">' + esc(erro || '') + '</p>' +
      '<button class="btn pri bloco" type="submit">' + I('cadeado') + 'Entrar</button><button type="button" class="btn fant bloco" data-a="esqueci">Esqueci minha senha</button></form>' +
      '<div class="rodape-e"><span>' + I('nuvem', 'p') + ' ' + esc(semProtocolo(Nuvem.cfg.url)) + '</span>' + (Nuvem.cfg.fixo ? '' : '<button type="button" data-a="desconectar-nuvem">Usar sem nuvem</button>') + '</div>';
  } else if (Nuvem.cfg) {
    html += '<p class="sub">Não foi possível conectar ao banco de dados agora.</p><div class="aviso" style="text-align:left;max-width:460px">' + I('alerta') + '<div>' + esc(Nuvem.erroInicio || 'Verifique a internet.') + '</div></div>' +
      '<div class="linha quebra" style="justify-content:center;margin-top:18px"><button type="button" class="btn pri" data-a="recarregar">' + I('sync') + 'Tentar de novo</button>' +
      (lerLS(K.eu, '') && socio(lerLS(K.eu, '')) ? '<button type="button" class="btn" data-a="continuar-offline">Usar a cópia deste aparelho</button>' : '') + '</div>' +
      (Nuvem.cfg.fixo ? '' : '<div class="rodape-e"><button type="button" data-a="desconectar-nuvem">Desconectar o banco</button></div>');
  } else {
    html += '<p class="sub">Quem está usando?</p><div class="perfis">' + DB.socios.map(function (s) {
      return '<button type="button" class="perfil" data-a="entrar-como" data-id="' + s.id + '">' + av(s.id) + '<b>' + esc(s.nome) + '</b><small>' + esc(s.cargo || 'Sócio') + '</small></button>';
    }).join('') + '</div>' +
      '<div class="rodape-e"><span>' + I('cadeado', 'p') + ' Dados salvos só neste navegador</span><button type="button" data-a="config-nuvem-entrada">Conectar banco na nuvem</button></div>';
  }
  e.innerHTML = html + '</div>';
  e.hidden = false; $('#app').classList.remove('on');
  var f = $('#lg-email'); if (f && !ehToque()) f.focus();
}
function mostrarQuemSou(email) {
  fecharTudo();
  var e = $('#entrada');
  e.innerHTML = '<div class="entrada-box"><svg aria-hidden="true"><use href="#logo"/></svg><h1>Quem é você?</h1><p class="sub">O e-mail <b>' + esc(email) + '</b> ainda não está ligado a um sócio. Escolha o seu perfil — é só desta vez.</p>' +
    '<div class="perfis">' + DB.socios.map(function (s) {
      return '<button type="button" class="perfil" data-a="vincular-email" data-id="' + s.id + '">' + av(s.id) + '<b>' + esc(s.nome) + '</b><small>' + esc(s.email ? 'ligado a ' + s.email : (s.cargo || 'Sócio')) + '</small></button>';
    }).join('') + '</div><div class="rodape-e"><button type="button" data-a="sair-entrada">Sair</button></div></div>';
  e.hidden = false; $('#app').classList.remove('on');
}
function entrar(id) {
  EU = id; gravarLS(K.eu, id);
  if (/access_token=|type=recovery/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + '#/inicio'); } catch (e) { } }
  var e = $('#entrada'); e.hidden = true; e.innerHTML = '';
  $('#app').classList.add('on');
  montarCasca();
  render(true);
}

/* ---------- eventos globais ---------- */
var renderFiltro = debounce(function () { render(); }, 160);
function ligarEventos() {
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    if (UI.menu && !UI.menu.contains(t)) { var anc = UI.menuAncora; fecharMenus(); if (anc && anc.contains(t)) { e.preventDefault(); return; } }
    if (UI.notif && !$('#notif').contains(t) && !t.closest('[data-a="notif"]')) fecharNotif();
    if (UI.folha && !$('#folha-mais').contains(t) && !t.closest('[data-a="folha-mais"],[data-a="folha-criar"]')) fecharFolha();
    var es = t.closest('.escolha button');
    if (es) { e.preventDefault(); tratarEscolha(es); return; }
    var a = t.closest('[data-a]'), link = t.closest('a[href]');
    if (a && link && a !== link && a.contains(link)) return;
    if (a && !a.disabled) { var fn = ACOES[a.dataset.a]; if (fn) { e.preventDefault(); fn(a, e); return; } }
    var ir = t.closest('[data-ir]');
    if (ir && !link && !t.closest('button')) { e.preventDefault(); irPara(ir.dataset.ir); }
  });
  $('#veu').addEventListener('click', function () { fecharGaveta(); });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest && e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    var fn = FORMS[f.dataset.form]; if (fn) fn(f);
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t || !t.dataset) return;
    if (UI.gaveta && t.closest('#gaveta') && !t.dataset.naoSuja) UI.sujo = true;
    if (t.dataset.cl != null && UI.form && UI.form.checklist) { var c = UI.form.checklist[+t.dataset.cl]; if (c) c.texto = t.value; }
    if (t.dataset.filtro && t.tagName === 'INPUT') { P[t.dataset.filtro] = t.value; salvarPrefs(); renderFiltro(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (!t || !t.dataset) return;
    if (UI.gaveta && t.closest && t.closest('#gaveta') && !t.dataset.naoSuja) UI.sujo = true;
    if (t.dataset.filtro && t.tagName === 'SELECT') { P[t.dataset.filtro] = t.value; salvarPrefs(); render(); }
  });
  document.addEventListener('focusout', function (e) {
    var t = e.target;
    if (t && t.dataset && t.dataset.tipo === 'moeda' && String(t.value).trim()) t.value = numBR(lerNumero(t.value));
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target || {}, tag = (t.tagName || '').toLowerCase(), digitando = tag === 'input' || tag === 'textarea' || tag === 'select' || t.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { if (!EU) return; e.preventDefault(); if (UI.paleta) fecharPaleta(); else abrirPaleta(); return; }
    if (e.key === 'Escape') {
      if (UI.modal) UI.modal();
      else if (UI.paleta) fecharPaleta();
      else if (UI.menu) fecharMenus();
      else if (UI.notif) fecharNotif();
      else if (UI.folha) fecharFolha();
      else if (UI.gaveta) fecharGaveta();
      else if (UI.kadd) { UI.kadd = ''; render(); }
      return;
    }
    if (UI.gaveta && t.closest && t.closest('#gaveta')) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'Enter' || e.key === 's' || e.key === 'S')) { e.preventDefault(); salvarGaveta(); return; }
      if (e.key === 'Enter' && tag === 'input' && !e.isComposing) {
        if (t.id === 'cl-novo') { e.preventDefault(); addChecklist(); }
        else if (t.id === 'coment-novo') { e.preventDefault(); addComentario(); }
        else if (t.dataset.cl != null) { e.preventDefault(); var n = $('#cl-novo'); if (n) n.focus(); }
        else if (t.dataset.campo && ['date', 'time', 'number'].indexOf(t.type) < 0) { e.preventDefault(); salvarGaveta(); }
      }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && !digitando && t.dataset && (t.dataset.ir || t.dataset.a) && tag !== 'button' && tag !== 'a') { e.preventDefault(); t.click(); return; }
    if (digitando || e.ctrlKey || e.metaKey || e.altKey || !EU || UI.modal || UI.paleta || UI.gaveta) return;
    if (e.key === '/') { e.preventDefault(); abrirPaleta(); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); formTarefa(null); }
  });
  window.addEventListener('hashchange', function () { if (!EU) return; fecharFolha(); fecharMenus(); fecharNotif(); if (UI.paleta) fecharPaleta(); if (UI.gaveta) fecharGaveta(); render(true); });
  window.addEventListener('resize', debounce(function () { if (EU && ((UI.rota.pag === 'projetos' && P.pVista === 'tempo') || UI.rota.pag === 'financeiro')) render(); }, 300));
  setInterval(function () { if (EU && document.visibilityState === 'visible' && !UI.gaveta && !UI.drag) atualizarCasca(); }, 60000);
}

/* ---------- início ---------- */
function iniciar() {
  P = lerLS(K.prefs, {}) || {};
  aplicarTema(P.tema || 'escuro');
  var salvo = lerLS(K.dados, null);
  DB = normalizarDB(salvo || semente());
  if (!salvo) gravarLS(K.dados, DB);
  Nuvem.fila = lerLS(K.fila, []) || [];
  ligarEventos();
  montarCasca();
  if (cfgNuvem()) {
    mostrarCarregando('Conectando ao banco de dados…');
    iniciarNuvem().then(function (ok) {
      if (ok && Nuvem.sessao) entrarNaNuvem();
      else mostrarEntrada();
    });
  } else {
    estadoNuvem('local');
    var eu = lerLS(K.eu, '');
    if (eu && socio(eu)) entrar(eu); else mostrarEntrada();
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();

})();

</script>
